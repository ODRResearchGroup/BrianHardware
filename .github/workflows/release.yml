name: Build and Release Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto reads #major / #minor from commit messages)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: MicroMod_ESP32

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history and tags to compute the version

      - name: Determine version
        id: version
        env:
          BUMP_INPUT: ${{ inputs.bump || 'auto' }}
        run: |
          SEMVER_GLOB='v[0-9]*.[0-9]*.[0-9]*'

          # If HEAD already carries a version tag (pushed manually), release that.
          EXISTING=$(git tag --points-at HEAD --list "$SEMVER_GLOB" --sort=-v:refname | head -n1)
          if [ -n "$EXISTING" ]; then
            echo "HEAD is already tagged $EXISTING"
            echo "tag=$EXISTING" >> "$GITHUB_OUTPUT"
            echo "version=${EXISTING#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST=$(git tag --list "$SEMVER_GLOB" --sort=-v:refname | head -n1)
          if [ -n "$LAST" ]; then
            RANGE="$LAST..HEAD"
          else
            LAST="v0.0.0"
            RANGE="HEAD"
          fi

          BUMP="$BUMP_INPUT"
          if [ "$BUMP" = "auto" ]; then
            LOG=$(git log --format='%B' $RANGE)
            if echo "$LOG" | grep -qE '#major|BREAKING CHANGE'; then
              BUMP=major
            elif echo "$LOG" | grep -qE '#minor'; then
              BUMP=minor
            else
              BUMP=patch
            fi
          fi

          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
          PATCH=${PATCH%%[-+]*}
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
          esac
          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Last release $LAST, bump $BUMP -> v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio "esptool>=4.7,<5"

      - name: Build firmware
        env:
          # Exposes the version to the firmware as the FIRMWARE_VERSION macro
          PLATFORMIO_BUILD_FLAGS: -DFIRMWARE_VERSION='"${{ steps.version.outputs.version }}"'
        run: pio run -e "$PIO_ENV"

      - name: Package release assets
        id: package
        run: |
          BUILD_DIR=".pio/build/$PIO_ENV"
          SHORT_SHA="${GITHUB_SHA::7}"
          OUT="dist"
          mkdir -p "$OUT"

          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"

          cp "$BUILD_DIR/firmware.bin"   "$OUT/firmware.bin"
          cp "$BUILD_DIR/bootloader.bin" "$OUT/bootloader.bin"
          cp "$BUILD_DIR/partitions.bin" "$OUT/partitions.bin"
          cp "$BOOT_APP0"                "$OUT/boot_app0.bin"
          cp "$BUILD_DIR/firmware.elf"   "$OUT/firmware.elf"

          # Single image that can be flashed at offset 0x0 (e.g. with a web flasher)
          esptool.py --chip esp32 merge_bin -o "$OUT/firmware-merged.bin" \
            0x1000  "$OUT/bootloader.bin" \
            0x8000  "$OUT/partitions.bin" \
            0xe000  "$OUT/boot_app0.bin" \
            0x10000 "$OUT/firmware.bin"

          (cd "$OUT" && sha256sum *.bin *.elf > SHA256SUMS.txt)

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          SHORT_SHA: ${{ steps.package.outputs.short_sha }}
        run: |
          cat > notes.md <<NOTES
          Firmware $TAG, automated build of \`${GITHUB_SHA}\` for \`${PIO_ENV}\`.

          **Flashing**
          - Full image: \`esptool.py --chip esp32 write_flash 0x0 firmware-merged.bin\`
          - App only (update): \`esptool.py --chip esp32 write_flash 0x10000 firmware.bin\`
          - Individual parts: bootloader \`0x1000\`, partitions \`0x8000\`, boot_app0 \`0xe000\`, firmware \`0x10000\`
          NOTES

          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Firmware $TAG" \
            --notes-file notes.md \
            --latest
