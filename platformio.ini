; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = MicroMod_ESP32

[env:MicroMod_ESP32]
; Owner-qualified so it can never resolve to the pioarduino platform used by
; the ESP32-C6 emulator envs (it is also named "espressif32", and an
; unqualified spec picks the highest installed version, i.e. pioarduino 55.x).
platform = platformio/espressif32@^7.1.3
board = sparkfun_esp32micromod
framework = arduino
; The emulator lives in src/emulator/ and must not be part of the V1 build.
build_src_filter = +<*> -<emulator/>
lib_deps = 
	adafruit/Adafruit BME680 Library@^2.0.5
	adafruit/Adafruit LC709203F@^1.3.4
	buelowp/sunset@^1.1.7
	thomasfredericks/Chrono@^1.2.0
	adafruit/Adafruit ADS1X15@^2.5.0

; ---------------------------------------------------------------------------
; BLE emulator: the V1 BLE contract (lib/BrianBLE) with synthetic data, for
; any ESP32 dev board with no sensors attached. See README "BLE emulator".
;   pio run -e emulator_esp32 -t upload
; Options (append to build_flags in an env, or set PLATFORMIO_BUILD_FLAGS):
;   -DBRIAN_SIM_INTERVAL_MS=1000  faster notify cycle (default 5000, like V1)
;   -DBRIAN_SIM_BOARDS=0x0B       emulated boards bitmask (here: no ADS3)
;   -DBRIAN_SIM_SEED=42           reproducible data (default: random)
;   -DBRIAN_SIM_EVENT_MEAN_S=90   mean seconds between odour events
; ---------------------------------------------------------------------------
[emulator]
framework = arduino
build_src_filter = +<emulator/>
monitor_speed = 115200
build_flags =

; Same platform/core (Arduino-ESP32 2.x) as the V1 firmware
[emulator_core2]
extends = emulator
platform = ${env:MicroMod_ESP32.platform}

; Arduino-ESP32 3.x, needed for the ESP32-C6. Pinned so builds are repeatable.
[emulator_core3]
extends = emulator
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip

[env:emulator_esp32]
extends = emulator_core2
board = esp32dev

[env:emulator_esp32s3]
extends = emulator_core2
board = esp32-s3-devkitc-1

[env:emulator_esp32c3]
extends = emulator_core2
board = esp32-c3-devkitm-1

[env:emulator_esp32c6]
extends = emulator_core3
board = esp32-c6-devkitc-1

[env:emulator_xiao_esp32c6]
extends = emulator_core3
board = seeed_xiao_esp32c6
